<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Notes — Three options</title>
<style>
:root{--ink:#18212f;--muted:#64748b;--line:#dbe3ee;--bg:#f4f7fb;--brand:#3659c9;--soft:#eef2ff;--warn:#805900;--warnbg:#fff7d6;--danger:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 24px;background:#fff;border-bottom:1px solid var(--line)}h1,h2,h3,p{margin-top:0}h1{margin-bottom:0;font-size:18px}h2{font-size:22px;line-height:1.3;margin-bottom:8px}h3{font-size:16px}.sub,.meta{color:var(--muted);font-size:14px}.sub{margin-top:2px}main{max-width:820px;margin:32px auto;padding:0 18px 32px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:0 3px 12px #15233a0a}.pill{display:inline-block;padding:3px 9px;border-radius:20px;background:var(--soft);color:#263b91;font-size:13px;font-weight:700}.context-list{margin:18px 0;padding:0;list-style:none}.trace,.group,.block,.question{border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}.trace{border-left:3px solid #91aaf8;background:#f8faff}.trace strong{font-size:14px}.source{margin-top:9px;padding:8px 10px;border-left:3px solid #9db4ff;border-radius:0 7px 7px 0;background:#f8faff;color:#42526b;font-size:14px}.warning{background:var(--warnbg);border-left-color:#f2be3e;color:#6e4a00}.accepted{border-color:#8cc9ae;background:#f3fcf6}.removed{opacity:.58}.success{color:#18794e}button{border:1px solid var(--brand);border-radius:8px;padding:10px 14px;background:var(--brand);color:#fff;font:inherit;font-weight:700;cursor:pointer}button:hover{background:#263f94}button:focus-visible,textarea:focus-visible{outline:3px solid #b8c8ff;outline-offset:2px}button.secondary{background:#fff;color:var(--brand)}button.secondary:hover{background:var(--soft)}button.danger{border-color:#efb4ae;background:#fff;color:var(--danger)}button.danger:hover{background:#fff2f0}button.small,.choice button{padding:7px 10px;font-size:14px}button:disabled{opacity:.48;cursor:not-allowed}.actions,.choice{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.choice{margin-top:10px}textarea{display:block;width:100%;min-height:88px;margin-top:10px;padding:10px;border:1px solid #b9c6d7;border-radius:8px;color:var(--ink);font:inherit;resize:vertical}.progress{margin-bottom:10px;color:var(--muted);font-size:14px}.preview{white-space:pre-wrap}@media(max-width:560px){header{padding:14px 16px}main{margin:18px auto;padding:0 12px 24px}.card{padding:18px}}
</style></head><body>
<header><div><h1>AI Notes</h1><div class="sub">Bài 5 — Overfitting và Regularization</div></div><div><span id="option-label" class="pill">Option A</span> <button class="secondary small" type="button" onclick="resetApp()">Bắt đầu lại</button></div></header><main><div id="app" class="card" aria-live="polite"></div></main>
<script>
const traces=[['Highlight','“Mô hình học thuộc dữ liệu train thay vì học quy luật chung”','Mục 1, 02:10'],['Highlight','“Loss train giảm nhưng loss validation tăng”','Mục 2, 04:12'],['Chưa hiểu','“L1 làm nhiều trọng số về đúng 0”','Mục 3, 07:30'],['Highlight','“λ quá lớn dẫn đến underfitting”','Mục 4, 10:05'],['Chưa hiểu','“Cross-validation để chọn λ”','Mục 4, 10:40'],['Câu hỏi','“Khi nào dùng L1, khi nào dùng L2?”','Mục 3'],['Ghi chú cá nhân','“Nhớ thử với bài tập tuần sau”','Mục 4']];
const groups=[['Overfitting là gì',[0,1]],['L1 và L2 regularization',[2,5]],['Chọn hệ số λ',[3,4,6]]];
const proposals=[['Overfitting là gì','Highlight #1 và #2','Overfitting: mô hình khớp train tốt nhưng kém tổng quát hóa; theo dõi validation loss để nhận biết.'],['L1 và L2 regularization','Điểm “Chưa hiểu” #3 và câu hỏi #6','L1 đưa một số trọng số về 0 nên có thể chọn lọc đặc trưng; L2 co nhỏ trọng số đều hơn.'],['Chọn hệ số λ','Highlight #4, điểm “Chưa hiểu” #5 và ghi chú cá nhân #7','λ quá lớn có thể gây underfitting. Bài nhắc dùng cross-validation để chọn λ; cần kiểm tra lại chi tiết.']];
const fixture=[['Tóm tắt','Overfitting xảy ra khi mô hình học quá sát dữ liệu train thay vì quy luật tổng quát. Một dấu hiệu là train loss giảm còn validation loss tăng.','Dựa trên highlight #1 và #2'],['Điểm chưa hiểu: L1 và L2','L1 có thể đưa một số trọng số về 0; L2 thường co nhỏ trọng số đều hơn. Cần kiểm tra thêm khi chọn L1 hay L2.','Dựa trên điểm “Chưa hiểu” #3 và câu hỏi #6'],['Chọn λ','λ quá lớn dẫn đến underfitting. Bài chỉ nhắc cross-validation để chọn λ; AI chưa chắc về chi tiết, nên kiểm tra lại.','⚠ AI chưa chắc — bài chỉ nhắc qua cross-validation ở dấu vết #5']];
const app=document.querySelector('#app');let option,screen,aGroups,aSummaries,bIndex,bChoices,cBlocks,cDraft;const esc=v=>String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function setOption(){option=['A','B','C'].includes(location.hash.slice(1).toUpperCase())?location.hash.slice(1).toUpperCase():'A';document.querySelector('#option-label').textContent=`Option ${option}`};function resetState(){screen='context';aGroups=[true,true,true];aSummaries=['','',''];bIndex=0;bChoices=[null,null,null];cBlocks=[true,true,true];cDraft=fixture.map(x=>[...x])}function resetApp(){resetState();render()}function start(){screen='work';render()}
function context(){return `<span class="pill">Bài học đã hoàn thành</span><h2>Bạn có 7 dấu vết từ bài này</h2><p class="meta">Hãy tạo một ghi chú bạn muốn giữ lại để review sau, không cần đọc lại toàn bộ bài.</p><ul class="context-list">${traces.map((t,i)=>`<li class="trace"><strong>${i+1}. ${t[0]}</strong><br>${esc(t[1])}<div class="meta">${t[2]}</div></li>`).join('')}</ul><div class="actions"><button onclick="start()">Tạo ghi chú cho bài này</button></div>`}
function optionA(){return `<span class="pill">AI chỉ nhóm và trỏ về nguồn</span><h2>Chọn nhóm, rồi tự viết điều bạn muốn nhớ</h2><p class="meta">AI không tự viết hoặc tóm tắt nội dung mới.</p>${groups.map((g,i)=>`<section class="group ${aGroups[i]?'':'removed'}"><h3>${i+1}. ${g[0]}</h3>${g[1].map(n=>`<div class="source"><strong>${traces[n][0]}</strong> · ${traces[n][2]}<br>${esc(traces[n][1])}</div>`).join('')}<label class="meta">Tóm tắt bằng lời của bạn</label><textarea ${aGroups[i]?'':'disabled'} placeholder="Viết điều bạn muốn nhớ…" oninput="aSummaries[${i}]=this.value">${esc(aSummaries[i])}</textarea><div class="choice"><button class="${aGroups[i]?'danger':'secondary'}" onclick="aGroups[${i}]=!aGroups[${i}];render()">${aGroups[i]?'Bỏ nhóm này':'Giữ lại nhóm này'}</button></div></section>`).join('')}<div class="actions"><button class="secondary" onclick="screen='context';render()">← Quay lại</button><button onclick="screen='preview';render()">Xem trước ghi chú</button></div>`}
function chooseB(action){let p=proposals[bIndex];bChoices[bIndex]={action,note:action==='Dùng đề xuất'?p[2]:action==='Tự sửa'?p[2]:''};if(action==='Tự sửa'){render();return}bIndex++;screen=bIndex===proposals.length?'preview':'work';render()}
function optionB(){let p=proposals[bIndex],choice=bChoices[bIndex];if(choice&&choice.action==='Tự sửa')return `<div class="progress">Cụm ${bIndex+1}/${proposals.length}</div><span class="pill">Bạn quyết nội dung</span><h2>Sửa đề xuất cho “${p[0]}”</h2><div class="source">Dựa trên: ${p[1]}</div><textarea id="b-edit">${esc(choice.note)}</textarea><div class="actions"><button class="secondary" onclick="bChoices[${bIndex}]=null;render()">← Quay lại</button><button onclick="bChoices[${bIndex}].note=document.querySelector('#b-edit').value;bIndex++;screen=bIndex===proposals.length?'preview':'work';render()">Dùng nội dung này</button></div>`;let isQuestion=bIndex===2;return `<div class="progress">Cụm ${bIndex+1}/${proposals.length}</div><span class="pill">AI đề xuất, bạn quyết</span><h2>${p[0]}</h2><div class="source">Dựa trên: ${p[1]}</div><div class="block preview">${esc(p[2])}</div>${isQuestion?`<div class="question"><strong>AI hỏi bạn</strong><p class="meta">Điểm “cross-validation để chọn λ” còn chưa rõ. Bạn muốn giữ nó để tự kiểm tra lại hay bỏ qua?</p><div class="choice"><button class="secondary" onclick="chooseB('Giữ để kiểm tra lại')">Giữ để kiểm tra lại</button><button class="secondary" onclick="chooseB('Bỏ qua')">Bỏ qua</button></div></div>`:''}<div class="actions"><button class="secondary" ${bIndex===0?'disabled':''} onclick="bIndex--;render()">← Trước</button>${isQuestion?'':`<button class="secondary" onclick="chooseB('Bỏ qua')">Bỏ qua</button><button class="secondary" onclick="chooseB('Tự sửa')">Sửa</button><button onclick="chooseB('Dùng đề xuất')">Dùng đề xuất</button>`}</div>`}
function optionC(){return `<span class="pill">Bản nháp cần bạn duyệt</span><h2>AI đã soạn từ bài học và dấu vết của bạn</h2><p class="meta">AI có thể bỏ sót hoặc hiểu sai. Bản nháp chưa được lưu.</p>${cDraft.map((b,i)=>`<section class="block ${cBlocks[i]?'accepted':'removed'}"><h3>${b[0]}</h3><textarea ${cBlocks[i]?'':'disabled'} oninput="cDraft[${i}][1]=this.value">${esc(b[1])}</textarea><div class="source ${i===2?'warning':''}">${b[2]}</div><div class="choice"><button class="${cBlocks[i]?'danger':'secondary'}" onclick="cBlocks[${i}]=!cBlocks[${i}];render()">${cBlocks[i]?'Xóa khối':'Khôi phục khối'}</button></div></section>`).join('')}<div class="actions"><button class="secondary" onclick="screen='context';render()">← Quay lại</button><button class="danger" onclick="screen='self';render()">Bỏ nháp, tự viết</button><button onclick="screen='preview';render()">Xem trước ghi chú</button></div>`}
function selfWrite(){return `<span class="pill">Tự viết ghi chú</span><h2>Bản nháp đã được bỏ</h2><p class="meta">Viết ghi chú của riêng bạn nếu bạn vẫn muốn lưu lại bài này.</p><textarea id="self-note" placeholder="Viết ghi chú của bạn…"></textarea><div class="actions"><button class="secondary" onclick="screen='work';render()">← Quay lại bản nháp</button><button onclick="cDraft=[['Ghi chú của bạn',document.querySelector('#self-note').value,'Bạn tự viết']];cBlocks=[true];screen='preview';render()">Xem trước ghi chú</button></div>`}
function content(){if(option==='A')return groups.map((g,i)=>aGroups[i]&&aSummaries[i].trim()?`${g[0]}\n${aSummaries[i].trim()}`:'').filter(Boolean);if(option==='B')return proposals.map((p,i)=>bChoices[i]&&bChoices[i].action!=='Bỏ qua'?`${p[0]}\n${bChoices[i].note||bChoices[i].action}`:'').filter(Boolean);return cDraft.map((b,i)=>cBlocks[i]&&b[1].trim()?`${b[0]}\n${b[1].trim()}`:'').filter(Boolean)}
function preview(){let c=content();return `<span class="pill">Xem trước — chưa lưu</span><h2>Ghi chú của bạn</h2><div class="block preview">${c.length?esc(c.join('\n\n')):'Chưa có nội dung nào được chọn.'}</div><p class="meta">Bạn vẫn có thể quay lại sửa hoặc bỏ ghi chú. Chỉ lưu khi bấm nút bên dưới.</p><div class="actions"><button class="secondary" onclick="screen='work';render()">← Quay lại sửa</button><button class="danger" onclick="resetApp()">Bỏ ghi chú</button><button onclick="save()">Lưu ghi chú</button></div>`}function save(){let saved=JSON.parse(sessionStorage.getItem('ai-notes-saved')||'[]');saved.push({option,content:content(),savedAt:new Date().toISOString()});sessionStorage.setItem('ai-notes-saved',JSON.stringify(saved));screen='saved';render()}function saved(){return `<h2 class="success">Đã lưu ghi chú</h2><p>Ghi chú được lưu trong phiên trình duyệt này sau khi bạn xác nhận.</p><div class="actions"><button onclick="resetApp()">Tạo ghi chú mới</button></div>`}
function render(){app.innerHTML=screen==='context'?context():screen==='work'?(option==='A'?optionA():option==='B'?optionB():optionC()):screen==='self'?selfWrite():screen==='preview'?preview():saved()}window.addEventListener('hashchange',()=>{setOption();resetState();render()});setOption();resetState();render();
</script></body></html>
